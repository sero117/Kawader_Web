<div class="relative overflow-hidden" style="background: var(--auth-bg); transition: background 0.25s; height: 99vh;">

  <!-- Blob shapes -->
  @for (b of blobs; track $index) {
    <div
      class="auth-blob"
      [style.top]="b.top"
      [style.left]="b.left"
      [style.width]="b.width"
      [style.height]="b.height"
      [style.--rot]="b.rot"
      [style.transform]="'rotate(' + b.rot + ')'"
      [style.animation-delay]="b.delay"
      [style.animation-duration]="b.duration"
    ></div>
  }

  <!-- Sparkles -->
  @for (s of sparkles; track $index) {
    <span
      class="auth-sparkle"
      [style.top]="s.top"
      [style.left]="s.left"
      [style.font-size]="s.size"
      [style.animation-duration]="s.duration"
      [style.animation-delay]="s.delay"
    >✦</span>
  }

  <!-- Back to landing page -->
  <a routerLink="/" class="fixed top-4 start-4 z-20 flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-xl transition-colors"
    style="color: var(--auth-fg-35, rgba(255,255,255,0.55)); background: var(--bg-subtle-sm);">
    <svg class="w-3.5 h-3.5 rtl:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
    </svg>
    {{ 'welcome.nav.main' | translate }}
  </a>

  <!-- Page content -->
  <div class="relative z-10 flex flex-col items-center px-4 py-8 overflow-y-auto" style="height: 100vh;">
    <div [@routeAnim]="routeAnim()" class="w-full flex flex-col items-stretch my-auto">
      <router-outlet />
    </div>
  </div>

</div>
